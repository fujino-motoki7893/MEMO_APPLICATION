databases:
  - name: memo-db
    databaseName: memodb
    user: memo
    plan: free

services:
  - type: web
    name: memo-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: memo-db
          property: connectionString
      - key: PORT
        value: 3001
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: memo-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: memo-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: memo-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
